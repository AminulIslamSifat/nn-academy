<h1>Trigonometric ufuncs</h1>

<p>All trig functions expect <strong>radians</strong>.</p>

<h2>Basic Trig</h2>

<div data-widget="pyrunner" data-cellid="025-cell-1" data-defaultcode="import numpy as np&#10;angles = np.array([0, np.pi/6, np.pi/4, np.pi/3, np.pi/2, np.pi])&#10;print(f&quot;Degrees: {np.rad2deg(angles).round(1)}&quot;)&#10;print(f&quot;sin:     {np.sin(angles).round(4)}&quot;)&#10;print(f&quot;cos:     {np.cos(angles).round(4)}&quot;)" data-timeout="5" data-title=""></div>

<h2>Inverse Trig</h2>

<div data-widget="pyrunner" data-cellid="025-cell-2" data-defaultcode="import numpy as np&#10;vals = np.array([0, 0.5, 0.7071, 1.0])&#10;print(f&quot;arcsin: {np.rad2deg(np.arcsin(vals)).round(1)}°&quot;)&#10;print(f&quot;arccos: {np.rad2deg(np.arccos(vals)).round(1)}°&quot;)&#10;x = np.array([1, 0, -1, 0])&#10;y = np.array([0, 1, 0, -1])&#10;print(f&quot;arctan2: {np.rad2deg(np.arctan2(y, x))}°&quot;)" data-timeout="5" data-title=""></div>

<h2>Degree Conversion</h2>

<div data-widget="pyrunner" data-cellid="025-cell-3" data-defaultcode="import numpy as np&#10;deg = np.array([0, 30, 45, 60, 90, 180, 360])&#10;rad = np.deg2rad(deg)&#10;print(f&quot;deg2rad: {rad.round(4)}&quot;)&#10;print(f&quot;Round-trip OK: {np.allclose(deg, np.rad2deg(rad))}&quot;)" data-timeout="5" data-title=""></div>
