<h1>Arithmetic ufuncs</h1>

<h2>Basic Operations</h2>

<div data-widget="pyrunner" data-cellid="018-cell-1" data-defaultcode="import numpy as np&#10;a = np.array([10, 20, 30, 40])&#10;b = np.array([1, 2, 3, 4])&#10;print(f&quot;add:      {np.add(a, b)}&quot;)&#10;print(f&quot;subtract: {np.subtract(a, b)}&quot;)&#10;print(f&quot;multiply: {np.multiply(a, b)}&quot;)&#10;print(f&quot;divide:   {np.divide(a, b)}&quot;)&#10;print(f&quot;power:    {np.power(b, 2)}&quot;)&#10;print(f&quot;mod:      {np.mod(a, 3)}&quot;)&#10;print(f&quot;a+b == np.add(a,b): {np.array_equal(a+b, np.add(a,b))}&quot;)" data-timeout="5" data-title=""></div>

<h2>Division Variants</h2>

<div data-widget="pyrunner" data-cellid="018-cell-2" data-defaultcode="import numpy as np&#10;a = np.array([7, -7, 8, -8])&#10;b = np.array([3, 3, 3, 3])&#10;print(f&quot;true_divide:  {np.true_divide(a, b)}&quot;)&#10;print(f&quot;floor_divide: {np.floor_divide(a, b)}&quot;)&#10;print(f&quot;remainder:    {np.remainder(a, b)}&quot;)&#10;print(f&quot;divmod:       {np.divmod(a, b)}&quot;)" data-timeout="5" data-title=""></div>

<h2>In-Place with out=</h2>

<div data-widget="pyrunner" data-cellid="018-cell-3" data-defaultcode="import numpy as np&#10;a = np.arange(5, dtype=np.float64)&#10;np.add(a, 10, out=a)&#10;print(f&quot;After +10: {a}&quot;)&#10;np.multiply(a, 2, out=a)&#10;print(f&quot;After ×2:  {a}&quot;)" data-timeout="5" data-title=""></div>
