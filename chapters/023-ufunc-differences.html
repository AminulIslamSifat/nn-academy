<h1>Difference ufuncs</h1>

<h2>np.diff</h2>

<div data-widget="pyrunner" data-cellid="023-cell-1" data-defaultcode="import numpy as np&#10;a = np.array([1, 3, 6, 10, 15])&#10;print(f&quot;diff:     {np.diff(a)}&quot;)&#10;print(f&quot;diff n=2: {np.diff(a, n=2)}&quot;)" data-timeout="5" data-title=""></div>

<h2>np.gradient: Central Differences</h2>

<div data-widget="pyrunner" data-cellid="023-cell-2" data-defaultcode="import numpy as np&#10;x = np.linspace(0, 2*np.pi, 100)&#10;dy_num = np.gradient(np.sin(x), x)&#10;dy_exact = np.cos(x)&#10;print(f&quot;Max error vs cos(x): {np.abs(dy_num-dy_exact).max():.6f}&quot;)" data-timeout="5" data-title=""></div>

<h2>Numerical Gradient Check</h2>

<div data-widget="pyrunner" data-cellid="023-cell-3" data-defaultcode="import numpy as np&#10;def f(x): return x**2&#10;def num_grad(f, x, eps=1e-7):&#10;    return (f(x+eps) - f(x-eps)) / (2*eps)&#10;x = 3.0&#10;print(f&quot;Numerical: {num_grad(f,x):.8f}&quot;)&#10;print(f&quot;Analytic:  {2*x:.8f}&quot;)&#10;print(f&quot;Match: {np.isclose(num_grad(f,x), 2*x)}&quot;)" data-timeout="5" data-title=""></div>
