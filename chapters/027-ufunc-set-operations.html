<h1>Set Operation ufuncs</h1>

<h2>unique</h2>

<div data-widget="pyrunner" data-cellid="027-cell-1" data-defaultcode="import numpy as np&#10;a = np.array([3, 1, 2, 3, 1, 4, 2, 5, 3])&#10;print(f&quot;unique:       {np.unique(a)}&quot;)&#10;print(f&quot;with counts:  {np.unique(a, return_counts=True)}&quot;)&#10;vals, inv = np.unique(a, return_inverse=True)&#10;print(f&quot;reconstruct:  {vals[inv]}&quot;)&#10;print(f&quot;match: {np.array_equal(vals[inv], a)}&quot;)" data-timeout="5" data-title=""></div>

<h2>Set Operations</h2>

<div data-widget="pyrunner" data-cellid="027-cell-2" data-defaultcode="import numpy as np&#10;a = np.array([1, 2, 3, 4, 5])&#10;b = np.array([3, 4, 5, 6, 7])&#10;print(f&quot;intersect: {np.intersect1d(a, b)}&quot;)&#10;print(f&quot;union:     {np.union1d(a, b)}&quot;)&#10;print(f&quot;setdiff:   {np.setdiff1d(a, b)}&quot;)&#10;print(f&quot;setxor:    {np.setxor1d(a, b)}&quot;)" data-timeout="5" data-title=""></div>
