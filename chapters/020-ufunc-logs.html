<h1>Logarithmic ufuncs</h1>

<h2>Basic Logs</h2>

<div data-widget="pyrunner" data-cellid="020-cell-1" data-defaultcode="import numpy as np&#10;a = np.array([1, 2, 4, 8, 16, 100], dtype=float)&#10;print(f&quot;ln:    {np.log(a).round(4)}&quot;)&#10;print(f&quot;log2:  {np.log2(a).round(4)}&quot;)&#10;print(f&quot;log10: {np.log10(a).round(4)}&quot;)&#10;print(f&quot;exp(ln(a))==a: {np.allclose(np.exp(np.log(a)), a)}&quot;)" data-timeout="5" data-title=""></div>

<h2>Numerical Stability</h2>

<div data-widget="pyrunner" data-cellid="020-cell-2" data-defaultcode="import numpy as np&#10;tiny = 1e-15&#10;print(f&quot;log(1+tiny): {np.log(1+tiny)}&quot;)   # loses precision&#10;print(f&quot;log1p(tiny): {np.log1p(tiny)}&quot;)     # accurate&#10;print(f&quot;exp(tiny)-1: {np.exp(tiny)-1}&quot;)     # loses precision&#10;print(f&quot;expm1(tiny): {np.expm1(tiny)}&quot;)     # accurate" data-timeout="5" data-title=""></div>

<h2>Stable Softmax</h2>

<div data-widget="pyrunner" data-cellid="020-cell-3" data-defaultcode="import numpy as np&#10;logits = np.array([1000, 1001, 1002])&#10;print(f&quot;Naive:    {np.exp(logits)/np.exp(logits).sum()}&quot;)  # nan!&#10;shifted = logits - logits.max()&#10;e = np.exp(shifted)&#10;print(f&quot;Stable:   {e/e.sum()}&quot;)" data-timeout="5" data-title=""></div>

<div data-widget="callout" data-type="danger" data-callouttitle="Cross-Entropy Safety" data-content="log(0) = -inf crashes training. Always clip probabilities: np.clip(probs, 1e-12, 1.0)."></div>
