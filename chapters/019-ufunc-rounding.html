<h1>Rounding ufuncs</h1>

<h2>Five Rounding Modes</h2>

<div data-widget="pyrunner" data-cellid="019-cell-1" data-defaultcode="import numpy as np&#10;vals = np.array([2.7, 2.3, -2.7, -2.3, 2.5, -2.5])&#10;print(f&quot;{&#39;Val&#39;:&gt;5s} {&#39;around&#39;:&gt;7s} {&#39;floor&#39;:&gt;6s} {&#39;ceil&#39;:&gt;6s} {&#39;trunc&#39;:&gt;6s}&quot;)&#10;for v in vals:&#10;    print(f&quot;{v:5.1f} {np.around(v):7.0f} {np.floor(v):6.0f} {np.ceil(v):6.0f} {np.trunc(v):6.0f}&quot;)" data-timeout="5" data-title=""></div>

<div data-widget="callout" data-type="info" data-callouttitle="Banker&#39;s Rounding" data-content="np.around uses round-half-to-even: 2.5→2, 3.5→4. Reduces statistical bias."></div>
