      <p class="text-sm mb-10 leading-relaxed" style="color: var(--text-muted);">Build your own ufuncs with frompyfunc and vectorize. Understand the tradeoffs.</p>

      <div class="prose prose-invert prose-zinc max-w-none prose-headings:text-zinc-100 prose-a:text-emerald-400 prose-strong:text-zinc-200 chapter-content" id="chapter-content">
        
<h1>Creating Custom ufuncs</h1>

<h2>np.frompyfunc</h2>

<div data-widget="pyrunner" data-cellid="017-cell-1" data-defaultcode="import numpy as np&#10;my_ufunc = np.frompyfunc(lambda x: x**2 + 2*x + 1, 1, 1)&#10;a = np.array([1, 2, 3, 4, 5])&#10;result = my_ufunc(a)&#10;print(f&quot;Result: {result}&quot;)&#10;print(f&quot;dtype: {result.dtype}&quot;)  # object!&#10;print(f&quot;As float: {result.astype(np.float64)}&quot;)" data-timeout="5" data-title=""></div>

<h2>np.vectorize</h2>

<div data-widget="pyrunner" data-cellid="017-cell-2" data-defaultcode="import numpy as np&#10;@np.vectorize&#10;def classify(x):&#10;    if x &lt; 0: return -1&#10;    elif x &lt; 5: return 0&#10;    else: return 1&#10;print(classify(np.array([-3, 0, 2, 5, 8])))" data-timeout="5" data-title=""></div>

<div data-widget="callout" data-type="warning" data-callouttitle="Not Actually Faster" data-content="vectorize and frompyfunc still call Python per element. For real speed, use native ufuncs or numba."></div>

<h2>Speed Comparison</h2>

<div data-widget="pyrunner" data-cellid="017-cell-3" data-defaultcode="import numpy as np, time&#10;n = 100_000&#10;a = np.random.randn(n)&#10;vec = np.vectorize(lambda x: x**2 if x &gt; 0 else 0)&#10;for name, fn in [(&quot;loop&quot;, lambda a: [x**2 if x&gt;0 else 0 for x in a]),&#10;                 (&quot;vectorize&quot;, vec),&#10;                 (&quot;native&quot;, lambda a: np.where(a&gt;0, a**2, 0))]:&#10;    t = time.perf_counter(); fn(a); print(f&quot;{name:12s}: {(time.perf_counter()-t)*1000:.1f} ms&quot;)" data-timeout="5" data-title=""></div>
