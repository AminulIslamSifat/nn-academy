<h1>Hyperbolic ufuncs</h1>

<h2>sinh, cosh, tanh</h2>

<div data-widget="pyrunner" data-cellid="026-cell-1" data-defaultcode="import numpy as np&#10;x = np.linspace(-3, 3, 7)&#10;print(f&quot;x:    {x.round(2)}&quot;)&#10;print(f&quot;sinh: {np.sinh(x).round(4)}&quot;)&#10;print(f&quot;cosh: {np.cosh(x).round(4)}&quot;)&#10;print(f&quot;tanh: {np.tanh(x).round(4)}&quot;)&#10;print(f&quot;cosh²-sinh²=1: {np.allclose(np.cosh(x)**2 - np.sinh(x)**2, 1)}&quot;)" data-timeout="5" data-title=""></div>

<h2>tanh as Activation</h2>

<div data-widget="pyrunner" data-cellid="026-cell-2" data-defaultcode="import numpy as np&#10;x = np.linspace(-5, 5, 11)&#10;for xi in x:&#10;    bar = &quot;█&quot; * int((np.tanh(xi)+1)*15)&#10;    print(f&quot;  {xi:+5.1f} → {np.tanh(xi):+.4f} {bar}&quot;)&#10;print(f&quot;&#10;tanh(0)={np.tanh(0)} (zero-centered!)&quot;)" data-timeout="5" data-title=""></div>

<h2>Inverse Hyperbolic</h2>

<div data-widget="pyrunner" data-cellid="026-cell-3" data-defaultcode="import numpy as np&#10;v = np.array([0, 0.5, 0.9, -0.5])&#10;print(f&quot;arcsinh: {np.arcsinh(v).round(4)}&quot;)&#10;print(f&quot;arctanh: {np.arctanh(v).round(4)}&quot;)" data-timeout="5" data-title=""></div>
